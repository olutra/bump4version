[bumpversion]
commit = True
tag = True
current_version = 1.0.0.dev2
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.(?P<release>dev)(?P<build>\d+))?
serialize = 
	{major}.{minor}.{patch}.{release}{build}
	{major}.{minor}.{patch}

[bumpversion:file:src/bump4version/__init__.py]

[bumpversion:file:pyproject.toml]
search = --bump4version
	version = "{current_version}"
replace = --bump4version
	version = "{new_version}"

[bumpversion:part:release]
optional_value = gamma
values = 
	dev
	gamma

[bumpversion:part:build]
first_value = 1
